name: Weekly issue

on:
  schedule:
    - cron: "17 21 * * 5"   # Fridays 21:17 UTC (Saturday 06:17 KST)
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue date YYYY-MM-DD (default: tomorrow, UTC)"
        required: false
      lookback:
        description: "Days to re-scan for late-indexed records (default 28)"
        required: false

permissions:
  contents: write

concurrency:
  group: weekly-issue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openrouter' }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      JOURNAL_TIERS: ${{ secrets.JOURNAL_TIERS }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      SCORE_BATCH: ${{ vars.SCORE_BATCH || '8' }}
      SCORE_WORKERS: ${{ vars.SCORE_WORKERS || '8' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Issue date
        id: date
        run: |
          ISSUE="${{ inputs.issue }}"
          [ -z "$ISSUE" ] && ISSUE=$(date -u -d tomorrow +%F)
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
      - name: Fetch
        run: |
          # a re-run for the same issue date reuses what an earlier attempt saved
          [ -f "data/candidates/${{ steps.date.outputs.issue }}.json" ] || \
            python -m pipeline.fetch --issue "${{ steps.date.outputs.issue }}" --lookback "${{ inputs.lookback || '28' }}"
      - name: Score
        run: |
          [ -f "data/scored/${{ steps.date.outputs.issue }}.json" ] || \
            python -m pipeline.score --issue "${{ steps.date.outputs.issue }}"
      - name: Select and summarize
        run: python -m pipeline.select --issue "${{ steps.date.outputs.issue }}"
      - name: Build site
        run: python -m pipeline.build
      - name: Commit
        if: always()
        run: |
          python -m pipeline.strip
          git config user.name "pem-archive bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if [ -f "data/issues/${{ steps.date.outputs.issue }}.json" ]; then MSG="Weekly issue ${{ steps.date.outputs.issue }}"; else MSG="Partial run ${{ steps.date.outputs.issue }} (re-run to finish)"; fi
          git diff --cached --quiet || git commit -m "$MSG"
          git push
