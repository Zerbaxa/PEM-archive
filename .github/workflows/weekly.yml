name: Weekly issue

on:
  schedule:
    - cron: "17 21 * * 5"   # Fridays 21:17 UTC (Saturday 06:17 KST)
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue date YYYY-MM-DD (default: tomorrow, UTC)"
        required: false

permissions:
  contents: write

concurrency:
  group: weekly-issue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openrouter' }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      JOURNAL_TIERS: ${{ secrets.JOURNAL_TIERS }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      SCORE_BATCH: ${{ vars.SCORE_BATCH || '8' }}
      SCORE_WORKERS: ${{ vars.SCORE_WORKERS || '4' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Issue date
        id: date
        run: echo "issue=${{ inputs.issue || '' }}" >> "$GITHUB_OUTPUT"
      - name: Run pipeline
        run: |
          ISSUE="${{ steps.date.outputs.issue }}"
          [ -z "$ISSUE" ] && ISSUE=$(date -u -d tomorrow +%F)
          python -m pipeline.fetch --issue "$ISSUE"
          python -m pipeline.score --issue "$ISSUE"
          python -m pipeline.select --issue "$ISSUE"
          python -m pipeline.build
          python -m pipeline.strip
      - name: Commit
        run: |
          git config user.name "pem-archive bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Weekly issue $(ls data/issues | tail -1 | cut -d. -f1)"
          git push
